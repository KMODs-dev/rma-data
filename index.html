<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineFlix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    body { background-color: #141414; color: #fff; padding-bottom: 70px; overflow-x: hidden; }

    /* Topo e Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%); position: fixed; top: 0; width: 100%; z-index: 1000; }
    .logo { color: #E50914; font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; }
    .search-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }

    /* Barra de Busca Expansível */
    .search-bar { display: none; padding: 10px 20px; margin-top: 60px; }
    .search-bar.active { display: block; }
    .search-bar input { width: 100%; padding: 10px; border-radius: 4px; border: none; background: #333; color: white; font-size: 0.9rem; }

    /* Destaque Principal (Hero Banner) */
    .hero { height: 60vh; background-size: cover; background-position: center; position: relative; display: flex; align-items: flex-end; padding: 20px; margin-bottom: 10px; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, #141414 0%, transparent 70%); }
    .hero-content { position: relative; z-index: 2; width: 100%; text-align: center; }
    .hero-title { font-size: 2rem; font-weight: bold; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    .hero-btns { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
    .btn-play { background: white; color: black; border: none; padding: 8px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .btn-info { background: rgba(109, 109, 110, 0.7); color: white; border: none; padding: 8px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    /* Seções de Carrossel */
    .row { margin: 15px 0 15px 15px; }
    .row-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #e5e5e5; }
    .row-posters { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; scrollbar-width: none; }
    .row-posters::-webkit-scrollbar { display: none; }
    .poster-card { flex: 0 0 120px; border-radius: 4px; overflow: hidden; transition: transform 0.2s; cursor: pointer; }
    .poster-card:hover { transform: scale(1.05); }
    .poster-card img { width: 100%; height: 170px; object-fit: cover; border-radius: 4px; }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #121212; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #222; z-index: 1000; }
    .nav-item { color: #808080; text-align: center; font-size: 0.7rem; text-decoration: none; cursor: pointer; }
    .nav-item.active { color: white; }
    .nav-icon { font-size: 1.2rem; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">NETFLIX</div>
    <button class="search-btn" onclick="toggleBusca()">🔍</button>
  </header>

  <div class="search-bar" id="search-bar">
    <input type="text" id="input-busca" placeholder="Buscar filmes ou séries..." onkeyup="buscarMidia(event)">
  </div>

  <!-- Banner Destaque estilo Netflix -->
  <div class="hero" id="hero-banner">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h2 class="hero-title" id="hero-title">Carregando...</h2>
      <div class="hero-btns">
        <button class="btn-play" id="btn-play-hero">▶ Assistir</button>
      </div>
    </div>
  </div>

  <!-- Carrosséis de Conteúdo -->
  <main>
    <div class="row">
      <h3 class="row-title">Em Alta</h3>
      <div class="row-posters" id="em-alta-row"></div>
    </div>

    <div class="row">
      <h3 class="row-title">Populares na Netflix</h3>
      <div class="row-posters" id="populares-row"></div>
    </div>

    <div class="row">
      <h3 class="row-title">Filmes de Ação</h3>
      <div class="row-posters" id="acao-row"></div>
    </div>
  </main>

  <!-- Navegação Inferior -->
<!-- Navegação Inferior Atualizada -->
<nav class="bottom-nav">
  <div class="nav-item active" onclick="carregarCatalogos()">
    <span class="nav-icon">🏠</span>Início
  </div>
  <div class="nav-item" onclick="toggleBusca()">
    <span class="nav-icon">🔍</span>Buscar
  </div>
  <div class="nav-item" onclick="abrirHistorico()">
    <span class="nav-icon">🕒</span>Histórico
  </div>
  <div class="nav-item" onclick="abrirCanaisEsportivos()">
    <span class="nav-icon">⚽</span>Esportes
  </div>
</nav>


  <script src="app.js"></script>
</body>
</html>
