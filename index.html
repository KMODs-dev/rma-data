<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineFlix - Guia de Filmes e Séries</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #fff; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { color: #eab308; margin-bottom: 15px; }
    .search-box { display: flex; justify-content: center; gap: 10px; max-width: 500px; margin: 0 auto; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #eab308; color: #0f172a; font-weight: bold; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #1e293b; border-radius: 10px; overflow: hidden; transition: transform 0.2s; cursor: pointer; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 260px; object-fit: cover; }
    .card-body { padding: 12px; }
    .card-body h3 { font-size: 0.95rem; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; }
    .rating { color: #eab308; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>🎬 CineFlix Explorer</h1>
    <div class="search-box">
      <input type="text" id="input-busca" placeholder="Digite o nome do filme ou série...">
      <button onclick="buscarMidia()">Buscar</button>
    </div>
  </header>

  <main>
    <div class="grid" id="filmes-grid">
      <!-- Os cards dos filmes serão inseridos via JavaScript aqui -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
